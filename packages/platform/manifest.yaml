kind: platform
name: HenglosIO
schemaVersion: 1
version: 1.0.0

# The platform builds itself: runner/build.js builds the board's MicroPython
# with the runtime frozen in (a board with firmware.build — else it compiles
# the runtime to .mpy with the mpy-cross of the board's firmware version),
# into `output` (what the driver installs); it also writes a board's firmware.
build:
  image:
    name: ghcr.io/henglos/micropython-workbench:v2
  script: ./runner/build.js
  output: /workspace/build

# Limits a workflow may override (studio → Platform). The build compiles the
# runtime with the workflow's values: `key` is the constant, `file` where it's
# assigned (under hio/, default system/SystemConfig.py), `default` must match
# what's written there. Protocol limits (group Protocol) are also what the
# host builds its packets with — @henglosio/workflow reads the same overrides
# (protocolLimits), so the two sides always agree. `rules` tie limits to each
# other; the build and the studio both check them.
#
# Not here on purpose: DEFAULT_BAUDRATE — it's the control link's speed, not
# a limit; changing it on the board alone would cut the driver off.
settings:
  # ── Memory ──────────────────────────────────────────────────────────────────
  - key: MAX_CONTEXT_ENTRIES
    displayName: Pipeline entries
    description: Configs and outputs the run keeps for binds and ctx.get(). Once full, new values are dropped — raise it for workflows with many actions.
    group: Memory
    type: integer
    default: 16
    min: 4
    max: 128

  - key: MAX_VARIABLES
    displayName: Variables
    description: Workflow variables the board holds at once. A Set past this goes out Fallback.
    group: Memory
    type: integer
    default: 16
    min: 0
    max: 128

  - key: MAX_SCRIPT_CACHE
    displayName: Compiled scripts kept
    description: Distinct Code scripts kept compiled. Each costs RAM; one that falls out is compiled again on its next run.
    group: Memory
    type: integer
    default: 8
    min: 1
    max: 32

  - key: MAX_FRAME_CONTENT
    displayName: Receive buffer
    description: Bytes buffered per link while a frame arrives. Must hold the largest frame (see Packet size).
    group: Memory
    type: integer
    default: 1024
    min: 128
    max: 8192
    unit: bytes

  # ── Storage ─────────────────────────────────────────────────────────────────
  - key: MAX_RECORD_SIZE
    displayName: Stored program size
    description: Bytes of flash the recorded program may take — the whole workflow, every action's EXECUTE frame.
    group: Storage
    type: integer
    default: 4096
    min: 512
    max: 65536
    unit: bytes

  - key: MAX_COMPONENT_NAME
    displayName: Component name length
    description: Longest component folder name REMOVE_COMPONENT accepts.
    group: Storage
    type: integer
    default: 32
    min: 8
    max: 128
    unit: chars

  # ── Timing ──────────────────────────────────────────────────────────────────
  - key: STREAM_TIMEOUT_MS
    displayName: Stream timeout
    description: How long an action reading a STREAM config waits for the host's next chunk before failing with TIMEOUT.
    group: Timing
    type: integer
    default: 2000
    min: 100
    max: 60000
    unit: ms

  # ── Protocol (the host builds its packets with these too) ──────────────────
  - key: MAX_PACKET_SIZE
    displayName: Packet size
    description: Upper bound for a frame's LEN — every EXECUTE and every response. The host splits nothing — an action that doesn't fit fails to compile.
    group: Protocol
    file: system/core/services/PacketCodec.py
    type: integer
    default: 1024
    min: 64
    max: 4096
    unit: bytes

  - key: MAX_DATA_BUFFER
    displayName: Config value size
    description: Largest value one EXECUTE carries — text, bytes, a color, a list or an object (its JSON).
    group: Protocol
    file: system/core/services/PacketCodec.py
    type: integer
    default: 512
    min: 4
    max: 4079
    unit: bytes

  - key: MAX_CODE_BUFFER
    displayName: Script size
    description: Largest Code script (CODE binding) one config carries.
    group: Protocol
    file: system/core/services/PacketCodec.py
    type: integer
    default: 192
    min: 16
    max: 4079
    unit: bytes

  - key: MAX_CONFIGS_PER_COMMAND
    displayName: Configs per action
    description: Configs one action's EXECUTE may carry — Start's include one per variable with an initial value.
    group: Protocol
    file: system/core/services/PacketCodec.py
    type: integer
    default: 15
    min: 1
    max: 64

  - key: MAX_OUTPUTS_PER_ACTION
    displayName: Outputs per action
    description: Connected outputs one action may have (Success, Fallback and custom ones).
    group: Protocol
    file: system/core/services/PacketCodec.py
    type: integer
    default: 4
    min: 1
    max: 16

rules:
  - key: MAX_FRAME_CONTENT
    atLeast: MAX_PACKET_SIZE
    plus: -5
    message: The receive buffer must hold a whole frame — at least Packet size − 5.
  - key: MAX_DATA_BUFFER
    atMost: MAX_PACKET_SIZE
    plus: -17
    message: A config value must fit in one packet with its headers — at most Packet size − 17.
  - key: MAX_CODE_BUFFER
    atMost: MAX_PACKET_SIZE
    plus: -17
    message: A script must fit in one packet with its headers — at most Packet size − 17.

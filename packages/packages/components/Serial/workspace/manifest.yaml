kind: component
name: Serial
schemaVersion: 1

dependences:
  platform: ^1.0.0

schema:
  displayName: Serial
  description: Board-to-board serial (UART) link between two HIO devices. "Begin" opens the port, "Send" frames a byte payload and writes it, "Receive" waits for one framed payload, "End" closes the port. Both sides use the board's free UART (not the control link) and the same PacketCodec envelope (CRC + delimitation), so wiring is just TX↔RX, RX↔TX and a shared GND.

  # Wire ids come from the lowercased displayName (see computeWireActionId /
  # computeWireConfigId): ACTION_ID = generateId("serial/<action>"),
  # CONFIG_ID = generateId("<action>/<config>"). Native side must match with the
  # same lowercased strings — IAction("serial", "begin"|"send"|"receive"|"end"),
  # Util::findConfig(configs, "begin/baudrate" | "send/data" | "receive/timeout" | ...).

  actions:
    - displayName: Begin
      description: Opens the board-to-board UART with the given pins and baud rate. Optional — Send/Receive open the port on their own — but useful to bring the link up once at the start of a workflow.
      configurations:
        - displayName: TX Pin
          description: Board pin wired to the other device's RX.
          type: pin
          from: board
          filterBy: [uart]
        - displayName: RX Pin
          description: Board pin wired to the other device's TX.
          type: pin
          from: board
          filterBy: [uart]
        - displayName: Baudrate
          description: Link speed. Must match the other board's Serial actions.
          type: options
          defaultValue: "115200"
          options:
            - displayName: "9600"
              value: "9600"
            - displayName: "19200"
              value: "19200"
            - displayName: "38400"
              value: "38400"
            - displayName: "57600"
              value: "57600"
            - displayName: "115200"
              value: "115200"
            - displayName: "230400"
              value: "230400"
      outputSchema:
        - name: ready
          type: bool
          description: True once the UART is open.

    - displayName: Send
      description: Frames Data into one PacketCodec DATA frame and writes it to the board-to-board UART.
      configurations:
        - displayName: TX Pin
          description: Board pin wired to the other device's RX.
          type: pin
          from: board
          filterBy: [uart]
        - displayName: RX Pin
          description: Board pin wired to the other device's TX.
          type: pin
          from: board
          filterBy: [uart]
        - displayName: Baudrate
          description: Link speed. Must match the other board's Serial actions.
          type: options
          defaultValue: "115200"
          options:
            - displayName: "9600"
              value: "9600"
            - displayName: "19200"
              value: "19200"
            - displayName: "38400"
              value: "38400"
            - displayName: "57600"
              value: "57600"
            - displayName: "115200"
              value: "115200"
            - displayName: "230400"
              value: "230400"
        - displayName: Data
          description: Bytes to send. Usually driven by a binding or script from an earlier action.
          type: bytes
      outputSchema:
        - name: sent
          type: int
          description: Number of payload bytes written.

    - displayName: Receive
      description: Waits up to Timeout for one complete DATA frame on the board-to-board UART and outputs its payload.
      configurations:
        - displayName: TX Pin
          description: Board pin wired to the other device's RX.
          type: pin
          from: board
          filterBy: [uart]
        - displayName: RX Pin
          description: Board pin wired to the other device's TX.
          type: pin
          from: board
          filterBy: [uart]
        - displayName: Baudrate
          description: Link speed. Must match the other board's Serial actions.
          type: options
          defaultValue: "115200"
          options:
            - displayName: "9600"
              value: "9600"
            - displayName: "19200"
              value: "19200"
            - displayName: "38400"
              value: "38400"
            - displayName: "57600"
              value: "57600"
            - displayName: "115200"
              value: "115200"
            - displayName: "230400"
              value: "230400"
        - displayName: Timeout
          description: How long to wait for a frame, in milliseconds (max 30000). On timeout the action takes its fallback branch.
          type: number
          defaultValue: "1000"
      outputSchema:
        - name: data
          type: int
          description: The received frame payload (byte array).

    - displayName: End
      description: Closes the board-to-board UART, releasing the driver and pins. Pair with Begin to bracket a run of Send/Receive actions.
      configurations:
        - displayName: TX Pin
          description: Board pin wired to the other device's RX.
          type: pin
          from: board
          filterBy: [uart]
        - displayName: RX Pin
          description: Board pin wired to the other device's TX.
          type: pin
          from: board
          filterBy: [uart]
      outputSchema:
        - name: closed
          type: bool
          description: True once the UART is closed.

build:
  cmakeFile: ./CMakeLists.txt
  register: hio_register_serial

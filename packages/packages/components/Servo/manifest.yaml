kind: component
name: Servo
schemaVersion: 1

dependences:
  platform: ^1.0.0

schema:

  displayName: Servo
  description: >
    Drives a hobby servo on a PWM-capable pin — To Angle for a positional
    servo (SG90-style, holds a 0-180° angle), Rotate for a continuous-rotation
    (360°) one (spins at a speed and direction), Release to cut the signal.

  # Wire ids come from the lowercased displayNames (computeWireActionId /
  # computeWireConfigId in @henglosio/workflow) — each script's @action and
  # context.get() names must match: "servo/<action>", "<action>/<config>".
  # Same actions and configs as the C++ Servo, plus the pulse calibration.

  actions:

    - displayName: To Angle
      description: Moves a positional servo to a fixed angle (0-180°) and holds it there.
      script: src/to_angle.py
      configurations:
        - displayName: Signal Pin
          description: Board pin the servo's signal wire is connected to.
          type: pin
          from: board
          filterBy: [pwm]
        - displayName: Angle
          description: Target angle, in degrees (0-180). Values outside the range are clamped.
          type: number
          defaultValue: "90"
        - displayName: Min Pulse
          advanced: true
          description: Pulse width at 0°, in microseconds. Raise it if the servo strains at 0°.
          type: number
          defaultValue: "500"
        - displayName: Max Pulse
          advanced: true
          description: Pulse width at 180°, in microseconds. Lower it if the servo strains at 180°.
          type: number
          defaultValue: "2500"
      outputSchema:
        - name: angle
          type: int
          description: The clamped angle the servo was moved to, in degrees (0-180).

    - displayName: Rotate
      description: >
        Spins a continuous-rotation (360°) servo at the given speed and
        direction. Speed 0 stops it. The signal is held until the next action
        on the same pin.
      script: src/rotate.py
      configurations:
        - displayName: Signal Pin
          description: Board pin the servo's signal wire is connected to.
          type: pin
          from: board
          filterBy: [pwm]
        - displayName: Speed
          description: Rotation speed, 0 (stopped) to 100 (max). Values outside the range are clamped.
          type: number
          defaultValue: "50"
        - displayName: Direction
          description: Rotation direction.
          type: options
          defaultValue: clockwise
          options:
            - displayName: Clockwise
              value: clockwise
            - displayName: Counterclockwise
              value: counterclockwise
        - displayName: Stop Pulse
          advanced: true
          description: Pulse width where this servo stands still, in microseconds. Nudge it (e.g. 1480 or 1520) if it creeps at Speed 0.
          type: number
          defaultValue: "1500"
        - displayName: Range
          advanced: true
          description: Microseconds from Stop Pulse to full speed.
          type: number
          defaultValue: "500"
      outputSchema:
        - name: speed
          type: int
          description: The clamped speed the servo was set to, 0-100.

    - displayName: Release
      description: >
        Cuts the signal: a positional servo stops holding its angle, a
        continuous one stops completely.
      script: src/release.py
      configurations:
        - displayName: Signal Pin
          description: Board pin the servo's signal wire is connected to.
          type: pin
          from: board
          filterBy: [pwm]

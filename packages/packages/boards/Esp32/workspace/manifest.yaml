kind: board
name: ESP32 Generic
schemaVersion: 1

dependences:
  platform: ^1.0.0

ui:
  schema: ./board.schema.yaml

# What the chip offers besides its pins — components that need one of these
# (their dependences.capabilities) only run on boards that list it.
capabilities: [wifi, bluetooth]

# The MicroPython port this board runs — the official ESP32_GENERIC image.
# `micropython` is also what the platform's build compiles the runtime and
# the components for. Bump `micropython` and `image` together.
firmware:
  micropython: 1.29.0
  image: https://micropython.org/resources/firmware/ESP32_GENERIC-20260824-v1.29.0.bin
  flash:
    chip: esp32
    # Quoted: unquoted, YAML reads 0x1000 as the number 4096. ESP32 (classic)
    # images start with the bootloader, which lives at 0x1000.
    offset: "0x1000"
  # The platform builds this board's MicroPython itself, with its runtime
  # frozen in (it runs from flash, leaving the RAM to the workflow) — same
  # version as `micropython`, same layout as `image` (same offset).
  build:
    port: esp32
    board: ESP32_GENERIC

[project]
name = "hio-sdk"
version = "3.0.0"
description = "SDK for writing HenglosIO component actions and triggers in MicroPython."
readme = "README.md"
license-files = ["LICENSE"]
authors = [
    { name = "Henglos" }
]
requires-python = ">=3.10"
dependencies = []
keywords = ["henglosio", "micropython", "iot", "sdk"]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# `henglosio` is a namespace (no henglosio/__init__.py): the sdk is
# henglosio.sdk, leaving room for other henglosio.* packages.
module-name = "henglosio.sdk"

[dependency-groups]
dev = ["pytest>=8"]

# Dev only — never published to PyPI (the runtime ships as @henglosio/hio-system
# on npm). Gives the tests and the editor `henglosio.sdk` from the workspace:
# uv installs packages/hio-sdk editable.
[project]
name = "hio-system"
version = "1.3.0"
requires-python = ">=3.10"
dependencies = ["hio-sdk"]

[tool.uv]
package = false

[tool.uv.sources]
hio-sdk = { workspace = true }

[dependency-groups]
dev = ["pytest>=8"]

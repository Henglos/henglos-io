    type: [digital_in, digital_out, pwm]
    displayName: GP25 (LED)
  - gpio: 26
    type: [digital_in, digital_out, analog_in, pwm]
    displayName: GP26
  - gpio: 27
    type: [digital_in, digital_out, analog_in, pwm]
    displayName: GP27
  - gpio: 28
    type: [digital_in, digital_out, analog_in, pwm]
    displayName: GP28
connection:
  serial:
    # USB CDC: the speed isn't used on the wire, but the driver opens the port
    # at the first one.
    baudrates: [115200, 9600, 19200, 38400, 57600, 230400, 460800, 921600]

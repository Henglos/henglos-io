kind: board
name: Raspberry Pi Pico
schemaVersion: 1

dependences:
  platform: ^1.4.0

ui:
  schema: ./src/board.schema.yaml

# The RP2040 offers nothing besides its pins (the Pico W adds Wi-Fi — another board).
capabilities: []

# How MicroPython gets onto it: src/firmware.ts writes the stock MicroPython by
# UF2 — the drive the Pico shows in its bootloader (BOOTSEL) — and the runtime
# goes on its filesystem as .mpy files. `micropython` is what they're compiled
# for, with the mpy-cross src/firmware.ts builds — bump it together with the
# version there.
#
# The image only needs git, make and a C compiler for that mpy-cross; the
# espressif workbench has them.
firmware:
  micropython: 1.29.0
  image: henglosio/workbench-espressif:1.0.0
  script: ./src/firmware.ts
  methods: [uf2]

kind: board
name: Raspberry Pi Pico
schemaVersion: 1

dependences:
  platform: ^1.4.0

ui:
  schema: ./src/board.schema.yaml

# The RP2040 offers nothing besides its pins (the Pico W adds Wi-Fi — another board).
capabilities: []

# How MicroPython gets onto it: src/firmware.ts builds MicroPython with the
# runtime frozen in, in the official image for RP2 boards, and writes it by UF2
# — the drive the Pico shows in its bootloader (BOOTSEL). `micropython` is also
# what the runtime and the components are compiled for, with the mpy-cross
# src/firmware.ts builds — bump it together with the version there.
firmware:
  micropython: 1.29.0
  image: henglosio/workbench-rp2:1.0.0
  script: ./src/firmware.ts
  methods: [uf2]

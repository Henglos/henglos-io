kind: board
name: ESP32 Generic
schemaVersion: 1

dependences:
  platform: ^2.0.0

ui:
  schema: ./src/board.schema.yaml

# What the chip offers besides its pins — components that need one of these
# (their dependences.capabilities) only run on boards that list it.
capabilities: [wifi, bluetooth]

# How MicroPython gets onto it: src/firmware.ts, in the official image for
# Espressif's chips.
# `micropython` is also what the runtime and the components are compiled for,
# with the mpy-cross src/firmware.ts builds — bump it together with the
# version there.
firmware:
  micropython: 1.29.0
  image: henglosio/workbench-espressif:1.0.0
  script: ./src/firmware.ts
  methods: [serial]

connection:
  serial:
    # Control-link baud. The board applies the persisted value (NVS "hio_serial",
    # written by the SET_CONNECTION command) on boot, falling back to the first
    # entry here. 115200 must stay first — it's the bootstrap/fallback baud the
    # daemon probes at, and HIO_DEFAULT_BAUDRATE in HIOSDK/common/defaults.h.
    baudrates: [115200, 9600, 19200, 38400, 57600, 230400, 460800, 921600]

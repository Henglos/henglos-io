name: ESP8266 Generic
description: An ESP8266 module — ESP-12E/F, NodeMCU, Wemos D1 mini or ESP-01S — with Wi-Fi.

# The pins a workflow can use, by GPIO number (what machine.Pin takes), with the
# NodeMCU / Wemos label. Left out: GPIO1 and GPIO3 — the serial port the driver
# talks to the board on — and GPIO6–11, wired to the flash. GPIO16 has no PWM.
# No analog_in: the ESP8266's only ADC is A0, read as ADC(0) — not by a pin.
# GPIO0, GPIO2 and GPIO15 decide how the module boots: whatever is wired to
# them must leave GPIO0 and GPIO2 high and GPIO15 low at reset.
pins:
  - gpio: 16
    type: [digital_in, digital_out]
    displayName: GPIO16 · D0
  - gpio: 5
    type: [digital_in, digital_out, pwm]
    displayName: GPIO5 · D1
  - gpio: 4
    type: [digital_in, digital_out, pwm]
    displayName: GPIO4 · D2
  - gpio: 0
    type: [digital_in, digital_out, pwm]
    displayName: GPIO0 · D3
  - gpio: 2
    type: [digital_in, digital_out, pwm]
    displayName: GPIO2 · D4
  - gpio: 14
    type: [digital_in, digital_out, pwm]
    displayName: GPIO14 · D5
  - gpio: 12
    type: [digital_in, digital_out, pwm]
    displayName: GPIO12 · D6
  - gpio: 13
    type: [digital_in, digital_out, pwm]
    displayName: GPIO13 · D7
  - gpio: 15
    type: [digital_in, digital_out, pwm]
    displayName: GPIO15 · D8

# How the driver talks to it. 115200 first: the one the driver tries first.
connection:
  serial:
    baudrates: [115200, 9600, 19200, 38400, 57600, 230400, 460800]

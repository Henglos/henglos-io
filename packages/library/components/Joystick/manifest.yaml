kind: component
name: Joystick
schemaVersion: 1

dependences:
  platform: ^1.2.0

schema:

  displayName: Joystick
  description: >
    A 2-axis analog joystick with a push button (KY-023 and the like — VRx,
    VRy, SW). Read gives x and y from -100 to 100, Direction branches Up,
    Down, Left, Right or Center, Button branches on the push button, and
    Calibrate sets where the stick rests.

  # Wire ids come from the lowercased displayNames (computeWireActionId /
  # computeWireConfigId in @henglosio/workflow) — each script's @action and
  # context.get() names must match: "joystick/<action>", "<action>/<config>".
  # The configs the actions share are written once (YAML anchors).
  #
  # Defaults: X on GPIO34 and Y on GPIO35 — the ESP32's ADC1, which keeps
  # working with Wi-Fi on (ADC2 pins don't) — and the button on GPIO32: 34-39
  # are input-only with no internal pull-up, which the button needs.

  actions:

    - displayName: Read
      description: Where the stick is — x and y from -100 to 100 (0 at rest), how far and which way it's pushed, and whether its button is down.
      script: src/read.py
      configurations:
        - &x
          displayName: X Pin
          name: xPin
          description: Board pin wired to the joystick's VRx — an analog input; GPIO32-39 keep working with Wi-Fi on.
          type: pin
          from: board
          filterBy: [analog_in]
          required: true
          default: { gpio: 34, type: [digital_in, analog_in], displayName: GPIO34 }
        - &y
          displayName: Y Pin
          name: yPin
          description: Board pin wired to the joystick's VRy — an analog input; GPIO32-39 keep working with Wi-Fi on.
          type: pin
          from: board
          filterBy: [analog_in]
          required: true
          default: { gpio: 35, type: [digital_in, analog_in], displayName: GPIO35 }
        - displayName: Button Pin
          name: buttonPin
          description: Board pin wired to the joystick's SW, to publish pressed — leave it empty if you don't use the button. Not GPIO34-39 (no pull-up).
          type: pin
          from: board
          filterBy: [digital_in, digital_out]
        - &deadZone
          displayName: Dead Zone
          name: deadZone
          advanced: true
          description: How far from the center still reads as 0, in % of the travel — 0 to 90. Raise it if the stick drifts at rest.
          type: number
          typeOptions: { minValue: 0, maxValue: 90 }
          default: 10
          placeholder: 0–90 %
        - &invertX
          displayName: Invert X
          name: invertX
          advanced: true
          description: Swap left and right — for a joystick mounted the other way round.
          type: boolean
          label: Flipped
          default: false
        - &invertY
          displayName: Invert Y
          name: invertY
          advanced: true
          description: Swap up and down — for a module whose Y reads the other way, or one mounted upside down.
          type: boolean
          label: Flipped
          default: false
        - &samples
          displayName: Samples
          name: samples
          advanced: true
          description: Readings averaged per axis, 1 to 64 — more is steadier, a little slower.
          type: number
          typeOptions: { numberPrecision: 0, minValue: 1, maxValue: 64 }
          default: 8
          placeholder: 1–64
      outputSchema:
        - name: x
          type: float
          description: Left (-100) to right (100), 0 at rest.
        - name: "y"
          type: float
          description: Down (-100) to up (100), 0 at rest.
        - name: magnitude
          type: float
          description: How far the stick is pushed, 0 to 100, whichever way.
        - name: angle
          type: float
          description: Which way it's pushed, in degrees — 0 right, 90 up, 180 left, 270 down. Only while it's pushed.
        - name: pressed
          type: bool
          description: Whether the button is down — with a Button Pin.
        - name: raw_x
          type: integer
          description: The voltage read on X, 0 (0 V) to 65535 (3.3 V) — to check the wiring. At rest it should be near the middle.
        - name: raw_y
          type: integer
          description: The voltage read on Y, 0 (0 V) to 65535 (3.3 V) — to check the wiring. At rest it should be near the middle.

    - displayName: Direction
      description: >
        Branches on where the stick points — Up, Down, Left, Right, or Center
        while it's near the middle. Split evenly: Center is a circle of radius
        Threshold, and each way a 90° slice of the stick's angle — a diagonal
        goes to the slice it falls in. A board connects 4 outputs of an action by default: leave one
        unconnected, or raise Outputs per action in Platform settings.
      script: src/direction.py
      configurations:
        - *x
        - *y
        - displayName: Threshold
          name: threshold
          description: How far the stick has to be pushed to count as a direction, in % — 1 to 100. Below it, Center.
          type: number
          typeOptions: { minValue: 1, maxValue: 100 }
          default: 50
          placeholder: 1–100 %
        - *deadZone
        - *invertX
        - *invertY
        - *samples
      outputs:
        - { id: up, name: Up }
        - { id: down, name: Down }
        - { id: left, name: Left }
        - { id: right, name: Right }
        - { id: center, name: Center }
      outputSchema:
        - name: x
          type: float
          description: Left (-100) to right (100), 0 at rest.
        - name: "y"
          type: float
          description: Down (-100) to up (100), 0 at rest.
        - name: angle
          type: float
          description: The stick's angle, in degrees — 0 right, 90 up, 180 left, 270 down.
        - name: direction
          type: any
          description: Where it points, as text — up, down, left, right or center.

    - displayName: Button
      description: Branches on the stick's push button — Pressed or Released, read twice Debounce apart so its chatter doesn't count.
      script: src/button.py
      configurations:
        - displayName: Button Pin
          name: buttonPin
          description: Board pin wired to the joystick's SW — not GPIO34-39 (no pull-up).
          type: pin
          from: board
          filterBy: [digital_in, digital_out]
          required: true
          default: { gpio: 32, type: [digital_in, digital_out, analog_in], displayName: GPIO32 }
        - displayName: Debounce
          name: debounce
          advanced: true
          description: How long the press has to hold to count, in ms — 0 to 500. 0 reads it once.
          type: number
          typeOptions: { numberPrecision: 0, minValue: 0, maxValue: 500 }
          default: 20
          placeholder: 0–500 ms
      outputs:
        - { id: pressed, name: Pressed }
        - { id: released, name: Released }
      outputSchema:
        - name: pressed
          type: bool
          description: Whether the button is down.

    - displayName: Calibrate
      description: >
        Takes where the stick rests now as its center, for Read and Direction
        on the same pins. Without it, the first reading at rest after the board starts
        is the center — fine as long as nobody's touching the stick then.
      script: src/calibrate.py
      configurations:
        - *x
        - *y
      outputSchema:
        - name: center_x
          type: integer
          description: X's voltage at rest, 0 (0 V) to 65535 (3.3 V).
        - name: center_y
          type: integer
          description: Y's voltage at rest, 0 (0 V) to 65535 (3.3 V).

kind: component
name: LCD
schemaVersion: 1

dependences:
  platform: ^1.2.0

schema:

  displayName: LCD
  description: >
    Shows text on a 16x2 (or 20x4) HD44780 character LCD — through an I2C
    backpack (the common "I2C LCD" module, 4 pins), or wired straight to the
    board in 4-bit parallel mode (6 pins) when there's no I2C. Print writes
    text or a bound value on a line, Clear blanks it, Backlight turns the
    light on or off. Every action on the same wiring drives the same display.

  # Wire ids come from the lowercased displayNames (computeWireActionId /
  # computeWireConfigId in @henglosio/workflow) — each script's @action and
  # context.get() names must match: "lcd/<action>", "<action>/<config>".
  #
  # The connection's configs are the same on every action — written once
  # (YAML anchors) and reused. Only the chosen connection's pins are sent:
  # hidden configs never are, which keeps Print within the board's 15
  # configs per action.
  #
  # Any GPIO works for every pin (I2C is done in software). The I2C defaults
  # are the ESP32's usual pair, GPIO21 / GPIO22.

  actions:

    - displayName: Print
      description: Writes text — or a bound value, like a sensor's reading — on a line of the display.
      script: src/print.py
      configurations:
        - &connection
          displayName: Connection
          description: How the display is wired — an I2C backpack (4 pins), or straight to the board (6 pins, no I2C needed).
          type: options
          defaultValue: i2c
          options:
            - displayName: I2C backpack
              value: i2c
            - displayName: Parallel (4-bit)
              value: parallel
        - &sda
          displayName: SDA Pin
          description: Board pin wired to the backpack's SDA.
          type: pin
          from: board
          filterBy: [digital_out]
          defaultValue: { gpio: 21, type: [digital_in, digital_out], displayName: GPIO21 }
          displayOptions: { show: { Connection: [i2c] } }
        - &scl
          displayName: SCL Pin
          description: Board pin wired to the backpack's SCL.
          type: pin
          from: board
          filterBy: [digital_out]
          defaultValue: { gpio: 22, type: [digital_in, digital_out], displayName: GPIO22 }
          displayOptions: { show: { Connection: [i2c] } }
        - &rs
          displayName: RS Pin
          description: Board pin wired to the display's RS (pin 4).
          type: pin
          from: board
          filterBy: [digital_out]
          displayOptions: { show: { Connection: [parallel] } }
        - &e
          displayName: E Pin
          description: Board pin wired to the display's E (pin 6). RW (pin 5) goes to GND.
          type: pin
          from: board
          filterBy: [digital_out]
          displayOptions: { show: { Connection: [parallel] } }
        - &d4
          displayName: D4 Pin
          description: Board pin wired to the display's D4 (pin 11).
          type: pin
          from: board
          filterBy: [digital_out]
          displayOptions: { show: { Connection: [parallel] } }
        - &d5
          displayName: D5 Pin
          description: Board pin wired to the display's D5 (pin 12).
          type: pin
          from: board
          filterBy: [digital_out]
          displayOptions: { show: { Connection: [parallel] } }
        - &d6
          displayName: D6 Pin
          description: Board pin wired to the display's D6 (pin 13).
          type: pin
          from: board
          filterBy: [digital_out]
          displayOptions: { show: { Connection: [parallel] } }
        - &d7
          displayName: D7 Pin
          description: Board pin wired to the display's D7 (pin 14).
          type: pin
          from: board
          filterBy: [digital_out]
          displayOptions: { show: { Connection: [parallel] } }
        - displayName: Text
          description: >
            What to show — type it, or bind an output or a variable (numbers are
            formatted, see Decimals). A typed \n goes on to the next line.
            Accents show as their plain letter (no glyphs for them on the LCD).
          type: string
          defaultValue: Hello, world!
          placeholder: e.g. Hello!
        - displayName: Line
          description: Which line to write on (3 and 4 only on a 20x4).
          type: options
          defaultValue: "1"
          options:
            - displayName: Line 1
              value: "1"
            - displayName: Line 2
              value: "2"
            - displayName: Line 3
              value: "3"
            - displayName: Line 4
              value: "4"
        - displayName: Align
          description: Where on the line the text goes.
          type: options
          defaultValue: left
          options:
            - displayName: Left
              value: left
            - displayName: Center
              value: center
            - displayName: Right
              value: right
        - displayName: Format
          advanced: true
          description: 'Text around Text — {} stands for it: "Temp: {} °C". Without {}, it goes before it.'
          type: string
          placeholder: "Temp: {} °C"
        - displayName: Column
          advanced: true
          description: Which column the text starts at, from 1.
          type: integer
          defaultValue: "1"
          displayOptions: { show: { Align: [left] } }
        - displayName: Clear Line
          advanced: true
          description: Blank the rest of the line, so a shorter text doesn't leave the end of the last one behind.
          type: toggle
          defaultValue: true
        - displayName: Decimals
          advanced: true
          description: Decimal places of a bound number that isn't whole (0–6).
          type: integer
          defaultValue: "2"
        - &address
          displayName: Address
          advanced: true
          description: The backpack's I2C address — 0x27 on most, 0x3F on some (PCF8574A).
          type: string
          defaultValue: "0x27"
          patterns: [I2CAddress7Bit]
          displayOptions: { show: { Connection: [i2c] } }
        - &size
          displayName: Size
          advanced: true
          description: The display's size, in characters.
          type: options
          defaultValue: 16x2
          options:
            - displayName: 16x2
              value: 16x2
            - displayName: 20x4
              value: 20x4

    - displayName: Clear
      description: Blanks the whole display, or one line of it.
      script: src/clear.py
      configurations:
        - *connection
        - *sda
        - *scl
        - *rs
        - *e
        - *d4
        - *d5
        - *d6
        - *d7
        - displayName: Line
          description: What to blank.
          type: options
          defaultValue: all
          options:
            - displayName: Whole display
              value: all
            - displayName: Line 1
              value: "1"
            - displayName: Line 2
              value: "2"
            - displayName: Line 3
              value: "3"
            - displayName: Line 4
              value: "4"
        - *address
        - *size

    - displayName: Backlight
      description: >
        Turns the backlight on or off — what's on the display stays. On I2C the
        backpack switches it; in parallel, the board drives Backlight Pin.
      script: src/backlight.py
      configurations:
        - *connection
        - *sda
        - *scl
        - displayName: Backlight Pin
          description: >
            Board pin driving the display's backlight (A, pin 15 — through a
            resistor, or a transistor for brighter modules). Parallel only.
          type: pin
          from: board
          filterBy: [digital_out]
          displayOptions: { show: { Connection: [parallel] } }
        - displayName: "On"
          description: Light on (or off).
          type: toggle
          label: "On"
          defaultValue: true
        - *address
        - *size

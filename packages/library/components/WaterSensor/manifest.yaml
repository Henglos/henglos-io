kind: component
name: Water Sensor
schemaVersion: 1

dependences:
  platform: ^3.0.0

schema:

  displayName: Water Sensor
  description: >
    An analog water level / leak sensor (the S + - module and the like): Read
    gives how much of it is under water, Detect branches Wet or Dry, Water
    Trigger runs a branch when it gets wet (or dries off), and Calibrate
    measures its Dry and Wet levels.

  # Wire ids come from the lowercased displayNames (computeWireActionId /
  # computeWireConfigId in @henglosio/workflow) — each script's @action /
  # @trigger and context.get() names must match: "water sensor/<action>",
  # "<action>/<config>". The configs they share are written once (YAML anchors).
  #
  # Default Signal on GPIO36: the ESP32's ADC1, which keeps reading with Wi-Fi
  # on (the ADC2 pins don't).

  actions:

    - displayName: Read
      icon: droplets
      description: How much of the sensor is under water — level from 0 (dry) to 100 % (as deep as it goes), wet once it reaches Threshold, and the raw reading.
      script: src/read.py
      configurations:
        - &signal
          displayName: Signal Pin
          name: signalPin
          description: Board pin wired to the sensor's S — an analog input; GPIO32-39 keep working with Wi-Fi on.
          type: pin
          from: board
          filterBy: [analog_in]
          required: true
          default: { gpio: 36, type: [digital_in, analog_in], displayName: GPIO36 }
        - &power
          displayName: Power Pin
          name: powerPin
          description: Board pin wired to the sensor's + — powered only while it reads, so its traces don't corrode. Empty, wire + to 3.3 V.
          type: pin
          from: board
          filterBy: [digital_out]
        - &threshold
          displayName: Threshold
          name: threshold
          description: The level it counts as wet from, in % — 1 to 100.
          type: number
          typeOptions: { minValue: 1, maxValue: 100 }
          default: 10
          placeholder: 1–100 %
        - &samples
          displayName: Samples
          name: samples
          advanced: true
          description: Readings averaged, 1 to 64 — more is steadier, a little slower.
          type: number
          typeOptions: { numberPrecision: 0, minValue: 1, maxValue: 64 }
          default: 8
          placeholder: 1–64
        - &dry
          displayName: Dry Level
          name: dryLevel
          advanced: true
          description: The raw reading out of the water (0 %), 0 to 65535 — until Calibrate measures it on the sensor.
          type: number
          typeOptions: { numberPrecision: 0, minValue: 0, maxValue: 65535 }
          default: 0
        - &wet
          displayName: Wet Level
          name: wetLevel
          advanced: true
          description: The raw reading as deep as it goes (100 %), 0 to 65535 — until Calibrate measures it on the sensor.
          type: number
          typeOptions: { numberPrecision: 0, minValue: 0, maxValue: 65535 }
          default: 35000
      outputSchema:
        - &levelOut
          name: level
          type: float
          description: How much of it is under water, 0 (dry) to 100 %.
        - name: wet
          type: bool
          description: Whether level reached Threshold.
        - &rawOut
          name: raw
          type: integer
          description: The voltage read, 0 (0 V) to 65535 (3.3 V) — to check the wiring and calibrate.

    - displayName: Detect
      icon: droplet
      description: Branches Wet or Dry — whether the level reaches Threshold. A leak under the sink, a full tank, rain.
      script: src/detect.py
      configurations:
        - *signal
        - *power
        - *threshold
        - *samples
        - *dry
        - *wet
      outputs:
        - { id: wet, name: Wet }
        - { id: dry, name: Dry }
      outputSchema:
        - *levelOut
        - *rawOut

    - displayName: Calibrate
      icon: gauge
      description: >
        Takes the reading now as the sensor's Dry level (out of the water) or
        Wet level (as deep as it goes), for Read, Detect and Water Trigger on
        the same Signal pin — run it once with each. Kept on the board
        (/data/water_sensor.json): it stays across runs and restarts.
      script: src/calibrate.py
      configurations:
        - *signal
        - *power
        - displayName: Point
          name: point
          description: Which level this reading is — the sensor out of the water (Dry), or under it as deep as it goes (Wet).
          type: options
          default: dry
          options:
            - { name: Dry, value: dry }
            - { name: Wet, value: wet }
        - displayName: Samples
          name: samples
          advanced: true
          description: Readings averaged, 1 to 64.
          type: number
          typeOptions: { numberPrecision: 0, minValue: 1, maxValue: 64 }
          default: 16
      outputSchema:
        - *rawOut
        - name: dry
          type: integer
          description: The Dry level set so far.
        - name: wet
          type: integer
          description: The Wet level set so far.

  # What starts a branch of the flow on its own — no input, only Out.
  triggers:

    - displayName: Water Trigger
      icon: siren
      description: >
        Runs its branch when the sensor gets wet — a leak, a tank full — or
        dries off, or either; read every Interval. Already wet when the program
        starts counts as getting wet.
      script: src/water_trigger.py
      configurations:
        - *signal
        - *power
        - *threshold
        - displayName: Fires On
          name: firesOn
          description: Which change runs the branch.
          type: options
          default: wet
          options:
            - { name: Getting wet, value: wet }
            - { name: Drying off, value: dry }
            - { name: Both, value: both }
        - displayName: Interval
          name: interval
          description: How often it reads, in ms — 50 at least.
          type: number
          typeOptions: { numberPrecision: 0, minValue: 50 }
          default: 500
          placeholder: 500 ms
        - *samples
        - *dry
        - *wet
      outputSchema:
        - *levelOut
        - name: wet
          type: bool
          description: Whether it's wet now — true when it fired on getting wet.
        - *rawOut

kind: component
name: Time
schemaVersion: 1

dependences:
  platform: ^3.0.0

schema:

  displayName: Time
  description: >
    Waits, measures and paces: delays, the board's clock, timers and
    intervals that run part of a loop on a fixed rhythm.

  # Wire ids come from the lowercased displayNames (computeWireActionId /
  # computeWireConfigId in @henglosio/workflow) — each script's @action and
  # context.get() names must match: "time/<action>", "<action>/<config>".

  actions:

    - displayName: Delay
      description: Waits for the given duration, then continues.
      script: src/delay.py
      configurations:
        - displayName: Duration
          name: duration
          description: How long to wait, in Unit.
          type: number
          default: 1000
        - displayName: Unit
          name: unit
          description: Unit of Duration.
          type: options
          default: ms
          options:
            - name: Milliseconds
              value: ms
            - name: Seconds
              value: s
            - name: Minutes
              value: min
      outputSchema:
        - name: duration
          type: integer
          description: The time waited, in milliseconds.

    - displayName: Uptime
      description: Reads the board's clock — milliseconds since it started.
      script: src/uptime.py
      outputSchema:
        - name: uptime
          type: integer
          description: Milliseconds since the board started (wraps around after ~12 days).

    - displayName: Start Timer
      description: Starts (or restarts) a named timer. Read it later with Elapsed.
      script: src/start_timer.py
      configurations:
        - displayName: Name
          name: name
          description: Which timer — Elapsed reads it by this same name.
          type: string
          default: timer

    - displayName: Elapsed
      description: How long since Start Timer started the timer with this name.
      script: src/elapsed.py
      configurations:
        - displayName: Name
          name: name
          description: The timer to read, as named in Start Timer.
          type: string
          default: timer
      outputSchema:
        - name: elapsed
          type: integer
          description: Milliseconds since the timer started.

    - displayName: Every
      description: >
        Goes out Due once every interval, Waiting the rest of the time — runs
        part of a looping program on a fixed rhythm without blocking the rest.
      script: src/every.py
      configurations:
        - displayName: Interval
          name: interval
          description: How often to go out Due, in Unit.
          type: number
          default: 1000
        - displayName: Unit
          name: unit
          description: Unit of Interval.
          type: options
          default: ms
          options:
            - name: Milliseconds
              value: ms
            - name: Seconds
              value: s
            - name: Minutes
              value: min
        - displayName: Name
          name: name
          advanced: true
          description: Tells several Every apart — each name keeps its own rhythm.
          type: string
          default: every
      outputs:
        - id: due
          name: Due
        - id: wait
          name: Waiting
      outputSchema:
        - name: elapsed
          type: integer
          description: Milliseconds since the last time it went out Due.

  # What starts a branch of the flow on its own — no input, only Out.
  triggers:

    - displayName: Timer Trigger
      icon: alarm-clock
      description: Runs its branch every Interval — on its own, alongside whatever Start does.
      script: src/timer_trigger.py
      configurations:
        - displayName: Interval
          name: interval
          description: Time between runs, in milliseconds (10 at least).
          type: number
          typeOptions: { numberPrecision: 0, minValue: 10 }
          default: 1000
          required: true
      outputSchema:
        - name: count
          type: integer
          description: How many times it fired since the program started.

kind: component
name: DHT
schemaVersion: 1

dependences:
  platform: ^1.2.0 || ^2.0.0

schema:

  displayName: DHT
  description: >
    A DHT11 or DHT22 (AM2302) temperature and humidity sensor on one data
    pin: Read gives both — with how hot it feels and the dew point — and
    Climate Trigger runs a branch when one of them goes past a limit.

  # Wire ids come from the lowercased displayNames (computeWireActionId /
  # computeWireConfigId in @henglosio/workflow) — each script's @action /
  # @trigger and context.get() names must match: "dht/<action>",
  # "<action>/<config>". The configs they share are written once (YAML anchors).

  actions:

    - displayName: Read
      icon: thermometer
      description: The temperature and the humidity — with how hot it feels (heat index) and the dew point. Fallback when the sensor doesn't answer, with the reason in error.
      script: src/read.py
      configurations:
        - &pin
          displayName: Data Pin
          name: dataPin
          description: Board pin wired to the sensor's data (DATA / S / OUT). A bare sensor needs a 10 kΩ pull-up from it to 3.3 V; a module has one.
          type: pin
          from: board
          filterBy: [digital_in, digital_out]
          required: true
          default: { gpio: 4, type: [digital_in, digital_out, analog_in, pwm, touch, uart], displayName: GPIO4 }
        - &model
          displayName: Model
          name: model
          description: Which sensor it is — DHT11 (blue, 0-50 °C, 1 reading a second) or DHT22 / AM2302 (white, -40-80 °C, finer, 1 every 2 s).
          type: options
          default: dht11
          options:
            - { name: DHT11, value: dht11 }
            - { name: DHT22 / AM2302, value: dht22 }
        - &unit
          displayName: Unit
          name: unit
          description: What temperature, heat_index and dew_point are in.
          type: options
          default: celsius
          options:
            - { name: Celsius (°C), value: celsius }
            - { name: Fahrenheit (°F), value: fahrenheit }
      outputSchema:
        - &temperature
          name: temperature
          type: float
          description: The temperature, in Unit — a DHT11 reads it in whole degrees.
        - &humidity
          name: humidity
          type: float
          description: The relative humidity, 0 to 100 %.
        - &heatIndex
          name: heat_index
          type: float
          description: How hot it feels, in Unit — the temperature itself in cool air, higher when it's hot and humid.
        - &dewPoint
          name: dew_point
          type: float
          description: The temperature the air would fog (and surfaces sweat) at, in Unit.
        - name: error
          type: string
          description: Why it's Fallback — no_pin, no_answer (the wiring, the pull-up, the Model picked or its power); empty otherwise.

  # What starts a branch of the flow on its own — no input, only Out.
  triggers:

    - displayName: Climate Trigger
      icon: thermometer-sun
      description: >
        Runs its branch when the temperature or the humidity goes above (or
        below) Limit — read every Interval. It fires again only once the value
        came back past Hysteresis, so one sitting right on Limit doesn't fire
        over and over. Past Limit when the program starts counts as getting there.
      script: src/climate_trigger.py
      configurations:
        - *pin
        - *model
        - displayName: Watch
          name: watch
          description: Which value it watches.
          type: options
          default: temperature
          options:
            - { name: Temperature, value: temperature }
            - { name: Humidity, value: humidity }
        - displayName: When
          name: when
          description: Which way past Limit fires it.
          type: options
          default: above
          options:
            - { name: Goes above Limit, value: above }
            - { name: Goes below Limit, value: below }
        - displayName: Limit
          name: limit
          description: The temperature (in Unit) or humidity (%) it fires past.
          type: number
          default: 30
          required: true
        - displayName: Hysteresis
          name: hysteresis
          advanced: true
          description: How far back past Limit the value has to come before it can fire again — in Unit or %.
          type: number
          typeOptions: { minValue: 0 }
          default: 1
        - displayName: Interval
          name: interval
          description: How often it reads, in ms — at least the sensor's own (1000 for a DHT11, 2000 for a DHT22).
          type: number
          typeOptions: { numberPrecision: 0, minValue: 1000 }
          default: 5000
          placeholder: 5000 ms
        - *unit
      outputSchema:
        - *temperature
        - *humidity
        - *heatIndex
        - *dewPoint

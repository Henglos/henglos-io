kind: component
name: WiFi
schemaVersion: 1

dependences:
  platform: ^1.2.0
  # What it needs of the board — only boards listing it run it.
  capabilities: [wifi]

schema:

  displayName: WiFi
  description: >
    The ESP32's WiFi — Connect the board to a network, check its Status,
    Scan for networks, make it an Access Point of its own, and Disconnect.
    What runs over it (HTTP, MQTT…) are components of their own.

  # Wire ids come from the lowercased displayNames (computeWireActionId /
  # computeWireConfigId in @henglosio/workflow) — each script's @action and
  # context.get() names must match: "wifi/<action>", "<action>/<config>".
  #
  # No pins: it's the chip's own radio. With it on, the ADC2 pins (0, 2, 4,
  # 12-15, 25-27) stop reading analog — see the README.
  #
  # The network to join is a credential (Credentials page): the workflow
  # holds which one, the hosting puts its values on the board (/secrets).

  credentials:
    - name: wifi
      displayName: WiFi Network
      description: A WiFi network to join — its name and password (2.4 GHz; the ESP32 doesn't do 5 GHz).
      fields:
        - name: ssid
          displayName: SSID
          description: The network's name, as phones show it.
          type: string
          required: true
          placeholder: e.g. MyHome
        - name: password
          displayName: Password
          description: Empty for an open network.
          type: string
          secret: true

  actions:

    - displayName: Connect
      description: >
        Joins the board to a WiFi network — goes on (Out) once it has an address,
        Fallback when the password is wrong, the network isn't there, or it took
        longer than Timeout. Already on that network: on at once. The
        connection stays up while the flow keeps running — a session that ends
        (Run ▶, Debug, a once-mode Play) drops it.
      script: src/connect.py
      configurations:
        - displayName: Network
          name: network
          description: The WiFi network to join — one of your credentials (its name and password), or a new one.
          type: credential
          credential: wifi
          required: true
        - displayName: Timeout
          name: timeout
          description: How long it tries before giving up, in ms — 1000 to 60000. The flow waits meanwhile.
          type: number
          typeOptions: { numberPrecision: 0, minValue: 1000, maxValue: 60000 }
          default: 10000
          placeholder: 1000-60000 ms
        - displayName: Hostname
          name: hostname
          advanced: true
          description: The name the board shows in the router's device list — empty keeps the default (espressif).
          type: string
          default: ""
          placeholder: e.g. henglos-board
      outputSchema:
        - &ipOut
          name: ip
          type: any
          description: The board's address on the network, as text — empty when not connected.
        - &ssidOut
          name: ssid
          type: any
          description: The network it's on, as text.
        - &rssiOut
          name: rssi
          type: integer
          description: The signal, in dBm — -30 strong, -70 fair, -90 barely there; 0 when not connected.
        - name: mac
          type: any
          description: The board's MAC address, as text — aa:bb:cc:dd:ee:ff.
        - name: reason
          type: any
          description: >
            Why it went Fallback, as text — wrong_password, no_network, failed,
            timeout, or no_credential (the network's credential isn't on the
            board: run the workflow again); empty once connected.

    - displayName: Disconnect
      description: Leaves the network, stops the board's Access Point, or both — the radio goes quiet for what's stopped.
      script: src/disconnect.py
      configurations:
        - displayName: Interface
          name: interface
          description: What to stop — the connection to a network (Station), the board's own network (Access Point), or both.
          type: options
          default: station
          options:
            - name: Station
              value: station
            - name: Access Point
              value: access_point
            - name: Both
              value: both

    - displayName: Status
      description: Branches on whether the board is on a network — Connected or Disconnected — with its address and signal, and how its Access Point is doing.
      script: src/status.py
      configurations: []
      outputs:
        - { id: connected, name: Connected }
        - { id: disconnected, name: Disconnected }
      outputSchema:
        - *ipOut
        - *ssidOut
        - *rssiOut
        - name: signal
          type: integer
          description: The signal as a percentage — 0 to 100.
        - name: ap_active
          type: bool
          description: Whether the board's Access Point is on.
        - name: ap_clients
          type: integer
          description: Devices joined to the board's Access Point.

    - displayName: Scan
      description: >
        Lists the WiFi networks around, strongest first — an empty list when
        there's none (or the radio couldn't scan). Takes a couple of seconds.
      script: src/scan.py
      configurations: []
      outputSchema:
        - name: networks
          type: { list: { object: { ssid: string, rssi: integer, channel: integer } } }
          description: The networks it saw (the 10 strongest), strongest first, each with its ssid, rssi (dBm) and channel — bind it to a List variable or a list config.

    - displayName: Access Point
      description: >
        Makes the board a WiFi network of its own, for phones and other boards
        to join — goes on (Out) with its address (usually 192.168.4.1), or Fallback.
        Works alongside Connect. It stays up while the flow keeps running — a
        session that ends (Run ▶, Debug, a once-mode Play) turns it off.
      script: src/access_point.py
      configurations:
        - displayName: SSID
          name: ssid
          description: The network's name, as others will see it.
          type: string
          required: true
          default: henglos
          placeholder: e.g. henglos
        - displayName: Password
          name: password
          description: 8 characters or more (WPA2) — empty for an open network anyone can join.
          type: string
          default: ""
          placeholder: open
        - displayName: Channel
          name: channel
          advanced: true
          description: The WiFi channel, 1 to 13 — another one if the air is crowded. With Connect on too, the board follows the network's channel.
          type: number
          typeOptions: { numberPrecision: 0, minValue: 1, maxValue: 13 }
          default: 1
          placeholder: 1–13
        - displayName: Max Clients
          name: maxClients
          advanced: true
          description: How many devices may join at once — 1 to 10.
          type: number
          typeOptions: { numberPrecision: 0, minValue: 1, maxValue: 10 }
          default: 4
          placeholder: 1–10
      outputSchema:
        - name: ip
          type: any
          description: The board's address on its own network, as text — usually 192.168.4.1.

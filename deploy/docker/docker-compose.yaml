# Henglos IO — the studio and the hosting behind one address, with Caddy in front.
#
#   cp .env.example .env      # then set HIO_JWT_SECRET and HIO_SECRETS_KEY
#   docker compose up -d
#
# Caddy routes /io/* (the API, the sockets, the collaborative editing) to the
# hosting and everything else to the studio — the studio calls the hosting on
# its own origin. See README.md.

name: henglos-io

services:

  hosting:
    image: henglosio/hosting:1.1.0
    restart: unless-stopped
    environment:
      HIO_JWT_SECRET: ${HIO_JWT_SECRET:?set HIO_JWT_SECRET in .env (openssl rand -hex 32)}
      HIO_SECRETS_KEY: ${HIO_SECRETS_KEY:?set HIO_SECRETS_KEY in .env (openssl rand -hex 32)}
      HIO_REGISTRY_URL: ${HIO_REGISTRY_URL:-https://registry.npmjs.org/}
      HIO_TELEMETRY: ${HIO_TELEMETRY:-true}
      # Caddy is in front: the rate limit reads the client's address from it.
      HIO_TRUST_PROXY: 1
    volumes:
      # The database (SQLite) and the installation's id.
      - hio-data:/data

  studio:
    image: henglosio/studio:1.1.0
    restart: unless-stopped
    depends_on:
      - hosting

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # A domain (hio.example.com) gets HTTPS from Let's Encrypt on its own;
      # the default, :80, serves plain HTTP on every address.
      HIO_SITE_ADDRESS: ${HIO_SITE_ADDRESS:-:80}
    ports:
      - "${HIO_HTTP_PORT:-80}:80"
      - "${HIO_HTTPS_PORT:-443}:443"
      - "${HIO_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      hosting:
        condition: service_healthy
      studio:
        condition: service_started

volumes:
  hio-data:
  caddy-data:
  caddy-config:

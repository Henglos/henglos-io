
name: henglos_io_hosting_dev

services:

  verdaccio:
    image: verdaccio/verdaccio
    container_name: henglosio-package-registry
    restart: unless-stopped
    environment:
      - VERDACCIO_PORT=4873
    ports:
      - "4873:4873"

    volumes:
      - verdaccio_storage:/verdaccio/storage
      - verdaccio_conf:/verdaccio/conf
      - verdaccio_plugins:/verdaccio/plugins

volumes:
  verdaccio_storage:
  verdaccio_conf:
  verdaccio_plugins:

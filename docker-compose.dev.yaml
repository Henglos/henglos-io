name: henglos_io_hosting_dev

services:

  # The dev registry for everything HenglosIO publishes: npm (the platform,
  # boards and components) and PyPI (hio-sdk), under the `henglosio` org.
  #   npm:  http://localhost:3000/api/packages/henglosio/npm/
  #   PyPI: http://localhost:3000/api/packages/henglosio/pypi  (install: .../pypi/simple)
  # The org must stay public: the hosting and the drivers read without a token.
  gitea:
    image: docker.gitea.com/gitea:28.3.0
    container_name: gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
    restart: always
    networks:
      - gitea
    volumes:
      - ./gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "222:22"

networks:
  gitea:
    external: false

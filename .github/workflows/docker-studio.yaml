name: Docker · studio

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    # Path filters only apply to branch pushes; a tag always builds.
    paths:
      - "apps/studio/**"
      - "packages/**"
      - "deploy/docker/images/studio/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".dockerignore"
      - ".github/workflows/docker-studio.yaml"
      - ".github/workflows/docker-build-push.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    uses: ./.github/workflows/docker-build-push.yaml
    with:
      app: studio
    secrets: inherit

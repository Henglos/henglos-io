name: Docker · workbenches

# The workbench images — where boards build and write their firmware (a board's
# firmware.image): deploy/docker/images/workbench-*/. Each is released on its
# own, by a tag, and a version is published once: boards pin it
# (henglosio/workbench-rp2:1.0.0), so what it holds never changes under them.
#
#   push to main, a workbench changed → it's built: :main, :sha-<short>
#   tag workbench-rp2@1.0.0           → workbench-rp2: :1.0.0, :latest (refused if 1.0.0 is published)
#   run by hand                       → the workbench picked (or all): :main, :sha-<short>
#
#   git tag workbench-rp2@1.0.0 && git push origin workbench-rp2@1.0.0
#
# Docker Hub (henglosio/<workbench>) and GHCR (ghcr.io/henglos/henglosio/<workbench>),
# multi-arch — see docker-build-push.yaml.

on:
  push:
    branches:
      - main
    tags:
      - "workbench-*@*"
    # Path filters only apply to branch pushes; a tag always builds.
    paths:
      - "deploy/docker/images/workbench-*/**"
      - ".github/workflows/docker-workbenches.yaml"
      - ".github/workflows/docker-build-push.yaml"
  workflow_dispatch:
    inputs:
      workbench:
        description: The workbench to build (workbench-espressif, workbench-rp2…) — empty for all. To release a version, push a tag.
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  plan:
    name: what to build
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Which workbenches, each with the version to release — empty for an edge build.
      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          PICKED: ${{ inputs.workbench }}
        run: |
          set -euo pipefail
          all=$(for dir in deploy/docker/images/workbench-*/; do basename "$dir"; done)
          version=""

          if [ "$REF_TYPE" = "tag" ]; then
            # workbench-rp2@1.0.0 → workbench-rp2, 1.0.0
            chosen="${REF_NAME%@*}"
            version="${REF_NAME#*@}"
            echo "$all" | grep -qx "$chosen" || { echo "::error::No workbench $chosen — there are: $(paste -sd ' ' <<< "$all")"; exit 1; }
            echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::$version isn't a version (x.y.z)"; exit 1; }
            if docker buildx imagetools inspect "henglosio/$chosen:$version" >/dev/null 2>&1; then
              echo "::error::henglosio/$chosen:$version is published already — boards pin it, so it's never replaced. Tag a new version."
              exit 1
            fi
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            if [ -n "$PICKED" ]; then
              echo "$all" | grep -qx "$PICKED" || { echo "::error::No workbench $PICKED — there are: $(paste -sd ' ' <<< "$all")"; exit 1; }
              chosen="$PICKED"
            else
              chosen="$all"
            fi
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            chosen="$all"
          elif git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -q '^\.github/workflows/'; then
            # The workflows changed: every workbench, so they're checked.
            chosen="$all"
          else
            chosen=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" | sed -n 's#^deploy/docker/images/\(workbench-[^/]*\)/.*#\1#p' | sort -u)
          fi

          matrix=$(for app in $chosen; do jq -cn --arg app "$app" --arg version "$version" '{app: $app, version: $version}'; done | jq -cs '{include: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "any=$([ -n "$chosen" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  image:
    name: ${{ matrix.app }}
    needs: plan
    if: needs.plan.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/docker-build-push.yaml
    with:
      app: ${{ matrix.app }}
      version: ${{ matrix.version }}
    secrets: inherit
